name: Broker

on:
  pull_request:
    paths:
      - "broker/**"
      - ".github/workflows/broker.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: broker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
