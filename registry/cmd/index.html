<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSL Apps</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#e7edf6;--muted:#92a0b5;--night:#09111f;--panel:#111c2e;--raised:#18263b;--line:#2a3b54;--blue:#60a5fa;--blue2:#2563eb;--green:#3ddc97;--red:#fb7185;--amber:#fbbf24;--radius:10px}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:radial-gradient(circle at 15% 0,#14243c 0,var(--night) 38%);color:var(--ink);min-height:100vh}
header{border-bottom:1px solid var(--line);padding:22px clamp(18px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:20px;background:rgba(9,17,31,.84);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
h1{font-size:1.25rem;letter-spacing:.02em}h1 span{color:var(--blue)}
.subtitle{color:var(--muted);font-size:.75rem;margin-top:5px}
main{padding:28px clamp(18px,4vw,48px) 60px;max-width:1440px;margin:auto}
.node{margin-bottom:34px}.node-head{display:flex;align-items:center;gap:12px;margin-bottom:13px;border-bottom:1px solid var(--line);padding-bottom:10px}.node-head h2{font-size:1rem}.node-id{font-size:.7rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:linear-gradient(145deg,var(--panel),#0d1727);border:1px solid var(--line);border-radius:var(--radius);padding:17px;min-height:165px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:#49698f}
.card-top{display:flex;justify-content:space-between;gap:10px}.card h3{font-size:.98rem}.description{font-family:system-ui,sans-serif;color:var(--muted);font-size:.82rem;line-height:1.45;margin:10px 0}.target{font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:4px 8px;height:max-content;background:#173152;color:#93c5fd}.pill.api{background:#183c32;color:#6ee7b7}.pill.off{background:#442531;color:#fda4af}
.actions{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}.button{border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:7px;padding:7px 11px;font:inherit;font-size:.72rem;cursor:pointer;text-decoration:none}.button:hover{border-color:var(--blue)}.button.primary{background:var(--blue2);border-color:var(--blue2)}.button.danger{color:#fecdd3}.button:disabled{opacity:.5;cursor:not-allowed}
.empty{color:var(--muted);padding:20px 0;font-size:.82rem}.terminal{min-height:auto;border-style:dashed}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,15,.76);display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.45)}.hidden{display:none!important}
.modal h2{font-size:1.05rem;margin-bottom:18px}.field{margin-bottom:13px}.field label{display:block;color:var(--muted);font-size:.72rem;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--night);color:var(--ink);border-radius:7px;padding:9px 11px;font:inherit;font-size:.8rem}.field input:focus,.field select:focus{outline:2px solid #1d4ed8;border-color:var(--blue)}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{position:fixed;right:22px;bottom:22px;background:var(--raised);border:1px solid var(--green);padding:11px 14px;border-radius:8px;font-size:.75rem;z-index:30}.toast.error{border-color:var(--red)}
@media(max-width:620px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.node-id{display:none}}
</style>
</head>
<body>
<header>
  <div><h1><span>apps</span>.<span id="domain">joedodge.dev</span></h1><div class="subtitle" id="revision">shared registry</div></div>
  <button class="button primary" onclick="openForm()">Register service</button>
</header>
<main id="content"><div class="empty">Loading registry state...</div></main>

<div class="modal-bg hidden" id="modal">
  <div class="modal">
    <h2 id="form-title">Register service</h2>
    <form id="form" onsubmit="saveApp(event)">
      <input type="hidden" id="app-id">
      <div class="field"><label for="name">Name</label><input id="name" required pattern=".*[A-Za-z0-9].*"></div>
      <div class="field"><label for="description">Description</label><input id="description"></div>
      <div class="field"><label for="node">Owning machine</label><select id="node" required></select></div>
      <div class="field"><label for="target">HTTP target reachable from Traefik</label><input id="target" required placeholder="http://host.docker.internal:4000"></div>
      <div class="field">
        <label for="policy">Exposure policy</label>
        <select id="policy">
          <option value="browser">Browser login for all routes</option>
          <option value="upstream">Upstream authentication for all routes</option>
          <option value="litellm">LiteLLM: browser login except /v1</option>
        </select>
      </div>
      <div class="form-actions"><button type="button" class="button" onclick="closeForm()">Cancel</button><button class="button primary">Save</button></div>
    </form>
  </div>
</div>

<script>
let config = {};
let nodes = [];
let apps = [];
let revision = 0;

const esc = value => { const element = document.createElement('span'); element.textContent = value || ''; return element.innerHTML; };
const slug = value => value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');
const appETag = app => `"app:${app.id}:${app.generation}"`;

async function request(url, options = {}) {
  const response = await fetch(url, options);
  if (!response.ok) throw new Error((await response.text()).trim() || response.statusText);
  return response;
}

async function load() {
  try {
    const [configResponse, nodeResponse, appResponse] = await Promise.all([
      request('/api/config'), request('/api/v2/nodes'), request('/api/v2/apps')
    ]);
    config = await configResponse.json();
    nodes = await nodeResponse.json();
    apps = await appResponse.json();
    revision = appResponse.headers.get('X-Registry-Revision') || '0';
    document.getElementById('domain').textContent = config.domain;
    document.getElementById('revision').textContent = `revision ${revision} | local node ${config.node_name}`;
    render();
  } catch (error) {
    document.getElementById('content').innerHTML = `<div class="empty">Registry unavailable: ${esc(error.message)}</div>`;
  }
}

function render() {
  const content = document.getElementById('content');
  if (!nodes.length) { content.innerHTML = '<div class="empty">No machines registered.</div>'; return; }
  content.innerHTML = nodes.map(node => {
    const owned = apps.filter(app => app.node_id === node.id);
    const cards = owned.map(app => appCard(app)).join('') || '<div class="empty">No services registered on this machine.</div>';
    const authOwner = (node.roles || []).includes('auth') ? '<span class="pill">auth owner</span>' : '';
    return `<section class="node">
      <div class="node-head"><h2>${esc(node.name)}</h2>${authOwner}<span class="node-id">${esc(node.id)}</span></div>
      <div class="grid">
        <article class="card terminal"><div class="card-top"><h3>Terminal</h3><span class="pill">TTY</span></div><div class="actions"><a class="button" target="_blank" rel="noreferrer" href="https://t--${encodeURIComponent(node.slug)}.${encodeURIComponent(config.domain)}">Open terminal</a></div></article>
        ${cards}
      </div>
    </section>`;
  }).join('');
}

function appCard(app) {
  const split = app.routes.length > 1;
  const policy = split ? 'split' : app.routes[0]?.auth || 'browser';
  return `<article class="card">
    <div><div class="card-top"><h3>${esc(app.name)}</h3><span class="pill ${policy === 'upstream' ? 'api' : ''} ${app.enabled ? '' : 'off'}">${app.enabled ? esc(policy) : 'disabled'}</span></div>
    <div class="description">${esc(app.description || 'No description')}</div><div class="target">${esc(app.target_url)}</div></div>
    <div class="actions"><a class="button primary" target="_blank" rel="noreferrer" href="${esc(app.public_url)}">Open</a><button class="button" onclick="editApp('${app.id}')">Edit</button><button class="button danger" onclick="removeApp('${app.id}')">Delete</button></div>
  </article>`;
}

function openForm(app = null) {
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('form').reset();
  document.getElementById('app-id').value = app?.id || '';
  document.getElementById('form-title').textContent = app ? 'Edit service' : 'Register service';
  document.getElementById('node').innerHTML = nodes.map(node => `<option value="${esc(node.id)}">${esc(node.name)}</option>`).join('');
  document.getElementById('node').value = app?.node_id || config.node_id;
  document.getElementById('name').value = app?.name || '';
  document.getElementById('description').value = app?.description || '';
  document.getElementById('target').value = app?.target_url || '';
  document.getElementById('policy').value = app ? inferPolicy(app) : 'browser';
}

function closeForm() { document.getElementById('modal').classList.add('hidden'); }
function editApp(id) { const app = apps.find(value => value.id === id); if (app) openForm(app); }
function inferPolicy(app) { if (app.routes.length > 1) return 'litellm'; return app.routes[0]?.auth || 'browser'; }

function routeInputs(name, nodeId, policy) {
  const node = nodes.find(value => value.id === nodeId);
  const hostname = `${slug(name)}--${node.slug}.${config.domain}`;
  if (policy === 'browser') return [];
  if (policy === 'upstream') return [{rule:`Host(\`${hostname}\`)`,priority:100,auth:'upstream'}];
  return [
    {rule:`Host(\`${hostname}\`) && !(Path(\`/v1\`) || PathPrefix(\`/v1/\`))`,priority:100,auth:'browser'},
    {rule:`Host(\`${hostname}\`) && (Path(\`/v1\`) || PathPrefix(\`/v1/\`))`,priority:110,auth:'upstream'}
  ];
}

async function saveApp(event) {
  event.preventDefault();
  const id = document.getElementById('app-id').value;
  const existing = apps.find(app => app.id === id);
  const name = document.getElementById('name').value;
  const nodeId = document.getElementById('node').value;
  const body = {
    name,
    node_id: nodeId,
    description: document.getElementById('description').value,
    target_url: document.getElementById('target').value,
    routes: routeInputs(name, nodeId, document.getElementById('policy').value)
  };
  try {
    const response = await request(id ? `/api/v2/apps/${id}` : '/api/v2/apps', {
      method: id ? 'PUT' : 'POST',
      headers: {'Content-Type':'application/json', ...(id ? {'If-Match':appETag(existing)} : {})},
      body: JSON.stringify(body)
    });
    await response.json();
    closeForm(); toast(id ? 'Service updated' : 'Service registered'); await load();
  } catch (error) { toast(error.message, true); }
}

async function removeApp(id) {
  const app = apps.find(value => value.id === id);
  if (!app || !confirm(`Delete ${app.name}?`)) return;
  try {
    await request(`/api/v2/apps/${id}`, {method:'DELETE',headers:{'If-Match':appETag(app)}});
    toast('Service deleted'); await load();
  } catch (error) { toast(error.message, true); }
}

function toast(message, error = false) {
  const element = document.createElement('div'); element.className = `toast${error ? ' error' : ''}`; element.textContent = message; document.body.appendChild(element); setTimeout(() => element.remove(), 3500);
}

load();
</script>
</body>
</html>
